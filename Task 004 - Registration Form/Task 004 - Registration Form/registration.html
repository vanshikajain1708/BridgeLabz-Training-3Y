<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 style="text-align:center;">Student Registration Form</h1>
    <form>
    <table border="1" width="60%" cellpadding="10" cellspacing="0" align="center">
        <tr>
            <th colspan="2" style="background-color: blueviolet;">Registration Form</th>
        </tr>
        <tr>
            <td width="30%">Full Name</td>
            <td><input type="text" placeholder="Enter your name" name="fullname"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" placeholder="abc@gmail.com" name="email"></td>
        </tr>
        <tr>
            <td>Phone Number</td>
            <td><input type="tel" placeholder="9876543210" name="phone"></td>
        </tr>
        <tr>
            <td>Date of Birth</td>
            <td><input type="date" name="dob"></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
                <input type="radio" name="gender" id="other" value="other">
                <label for="other">Other</label>
            </td>
        </tr>
        <tr>
            <td>Skills</td>
            <td>
                <input type="checkbox" id="html" value="html">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="js" value="js">
                <label for="js">JavaScript</label>
            </td>
        </tr>
        <tr>
            <td>Course</td>
            <td>
                <select name="course">
                    <option value="">--Select Course--</option>
                    <option value="btech">B.Tech</option>
                    <option value="bca">BCA</option>
                    <option value="mca">MCA</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea rows="4" cols="40"></textarea></td>
        </tr>
        <tr>
            <td>Upload Resume</td>
            <td><input type="file" name="resume"></td>
        </tr>
        <tr>
            <th colspan="2">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </th>
        </tr>
    </table>
    </form>
</body>
</html>
