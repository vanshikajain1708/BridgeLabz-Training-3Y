<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6-gallery.css">
</head>
<body>
    <h1>Photo Gallery</h1>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://picsum.photos/id/10/400/300" alt="Nature 1">
            <div class="caption">Mountain View</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/20/400/300" alt="Nature 2">
            <div class="caption">Forest Path</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/30/400/300" alt="Nature 3">
            <div class="caption">River Side</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/40/400/300" alt="Nature 4">
            <div class="caption">Sunset View</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/50/400/300" alt="Nature 5">
            <div class="caption">City Lights</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/60/400/300" alt="Nature 6">
            <div class="caption">Ocean Waves</div>
        </div>
    </div>
</body>
</html>
