<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="q5-pricing.css">
</head>
<body>
    <h1>Choose Your Plan</h1>

    <div class="pricing-container">
        <div class="plan">
            <h2>Basic</h2>
            <ul>
                <li>5 Projects</li>
                <li>10GB Storage</li>
                <li>Email Support</li>
            </ul>
            <p class="price">$9/mo</p>
            <a href="#" class="btn">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <ul>
                <li>20 Projects</li>
                <li>50GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <p class="price">$29/mo</p>
            <a href="#" class="btn">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <ul>
                <li>Unlimited Projects</li>
                <li>200GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <p class="price">$59/mo</p>
            <a href="#" class="btn">Choose Plan</a>
        </div>
    </div>
</body>
</html>
