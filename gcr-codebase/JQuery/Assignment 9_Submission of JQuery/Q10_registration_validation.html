<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 440px; margin: 0 auto; padding: 0 16px; }
    header { text-align: center; padding: 24px 0 8px; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 9px; margin-top: 4px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px; }
    .error { color: #c62828; font-size: 13px; min-height: 16px; margin-top: 3px; }
    button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
    #successMessage { display: none; margin-top: 16px; padding: 12px; background: #c8e6c9; color: #1b5e20; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Create Account</h1>
  </header>

  <main>
    <section aria-label="Registration form">
      <form id="registrationForm" novalidate>
        <fieldset>
          <legend>Registration</legend>

          <label for="name">Name</label>
          <input type="text" id="name" />
          <div class="error" id="nameError"></div>

          <label for="email">Email</label>
          <input type="text" id="email" />
          <div class="error" id="emailError"></div>

          <label for="password">Password</label>
          <input type="password" id="password" />
          <div class="error" id="passwordError"></div>

          <button type="submit">Register</button>
        </fieldset>
      </form>
      <div id="successMessage" role="status">Registration successful!</div>
    </section>
  </main>

  <footer>
    <p>Validation demo built with jQuery</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Q10_registration_validation.js"></script>
</body>
</html>
