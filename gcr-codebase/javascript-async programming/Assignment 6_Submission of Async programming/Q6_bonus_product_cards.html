<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Cards</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h2 { text-align: center; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); text-align: center; }
    .card img { height: 160px; max-width: 100%; object-fit: contain; }
    .card h3 { font-size: 14px; margin: 10px 0 6px; }
    .card p { color: green; font-weight: bold; margin: 0; }
    #error { color: red; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Our Products</h2>
  <div id="error"></div>
  <div id="products"></div>

  <script>
    async function loadProducts() {
      const container = document.getElementById("products");
      const errorBox = document.getElementById("error");

      try {
        const response = await fetch("https://fakestoreapi.com/products");
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }
        const products = await response.json();

        products.forEach((product) => {
          // Build each card with document.createElement()
          const card = document.createElement("div");
          card.className = "card";

          const image = document.createElement("img");
          image.src = product.image;
          image.alt = product.title;

          const title = document.createElement("h3");
          title.textContent = product.title;

          const price = document.createElement("p");
          price.textContent = `$${product.price.toFixed(2)}`;

          card.appendChild(image);
          card.appendChild(title);
          card.appendChild(price);
          container.appendChild(card);
        });
      } catch (error) {
        errorBox.textContent = "Failed to load products. Please try again.";
      }
    }

    loadProducts();
  </script>
</body>
</html>
