<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .card { padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    #progress { font-weight: bold; color: #555; }
    .step { display: none; }
    .step.active { display: block; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .error { color: red; font-size: 13px; min-height: 16px; margin-top: 4px; }
    .buttons { display: flex; justify-content: space-between; margin-top: 16px; }
    button { padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Registration</h2>

  <div class="card" id="formCard">
    <p id="progress">Step 1 of 3</p>

    <div class="step active">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" />
      <div class="error" id="error0"></div>
    </div>

    <div class="step">
      <label for="emailInput">Email</label>
      <input type="text" id="emailInput" />
      <div class="error" id="error1"></div>
    </div>

    <div class="step">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" />
      <div class="error" id="error2"></div>
    </div>

    <div class="buttons">
      <button type="button" id="backButton">Back</button>
      <button type="button" id="nextButton">Next</button>
    </div>
  </div>

  <div class="card" id="summary" style="display: none">
    <h3>Summary</h3>
    <p><b>Name:</b> <span id="summaryName"></span></p>
    <p><b>Email:</b> <span id="summaryEmail"></span></p>
    <p><b>Password:</b> <span id="summaryPassword"></span></p>
    <button type="button" id="restartButton">Start Over</button>
  </div>

  <script src="Q3_multi_step_form.js"></script>
</body>
</html>
