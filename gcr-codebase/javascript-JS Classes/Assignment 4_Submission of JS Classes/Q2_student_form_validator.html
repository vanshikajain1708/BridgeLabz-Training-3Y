<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; margin-top: 2px; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    #successMessage { color: green; font-weight: bold; margin-top: 14px; }
  </style>
</head>
<body>
  <h2>Student Registration</h2>

  <form id="registrationForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Only alphabets" />
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="text" id="email" placeholder="example@domain.com" />
    <div class="error" id="emailError"></div>

    <label for="phone">Phone</label>
    <input type="text" id="phone" placeholder="10 digit number" />
    <div class="error" id="phoneError"></div>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Uppercase, number, special character" />
    <div class="error" id="passwordError"></div>

    <button type="submit">Register</button>
  </form>

  <div id="successMessage"></div>

  <script>
    // Validation rules: one RegExp and one error message for each field
    const rules = {
      name: {
        regex: /^[A-Za-z]+(?: [A-Za-z]+)*$/, // only alphabets (single spaces between words allowed)
        message: "Name can contain only alphabets.",
      },
      email: {
        regex: /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/, // example@domain.com
        message: "Enter a valid email like example@domain.com.",
      },
      phone: {
        regex: /^\d{10}$/, // exactly 10 digits
        message: "Phone must be exactly 10 digits.",
      },
      password: {
        // lookaheads: at least 1 uppercase, 1 number and 1 special character
        regex: /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).+$/,
        message: "Password needs 1 uppercase letter, 1 number and 1 special character.",
      },
    };

    function validateField(id) {
      const input = document.getElementById(id);
      const error = document.getElementById(id + "Error");
      const value = id === "password" ? input.value : input.value.trim();

      const isValid = rules[id].regex.test(value);

      // Red border + message if invalid, green border if valid
      input.classList.toggle("valid", isValid);
      input.classList.toggle("invalid", !isValid);
      error.textContent = isValid ? "" : rules[id].message;
      return isValid;
    }

    // Validate while the user types
    Object.keys(rules).forEach((id) => {
      document.getElementById(id).addEventListener("input", () => validateField(id));
    });

    document.getElementById("registrationForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const results = Object.keys(rules).map(validateField); // validate every field
      const allValid = results.every((result) => result === true);
      document.getElementById("successMessage").textContent = allValid
        ? "Registration successful!"
        : "";
    });
  </script>
</body>
</html>
