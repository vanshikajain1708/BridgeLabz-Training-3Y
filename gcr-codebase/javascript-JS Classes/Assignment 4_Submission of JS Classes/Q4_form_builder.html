<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Form Builder</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    input[type="checkbox"] { width: auto; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Custom Form Builder</h2>
  <div id="formContainer"></div>
  <h3>Submitted Data</h3>
  <pre id="output">Nothing submitted yet.</pre>

  <script>
    class FormBuilder {
      constructor(containerId, fields, onSubmit) {
        this.container = document.getElementById(containerId);
        this.fields = fields;
        this.onSubmit = onSubmit;
        this.render();
      }

      // Creates the form dynamically using innerHTML
      render() {
        let html = '<form id="builtForm">';

        this.fields.forEach((field, index) => {
          const id = "field_" + index;
          html += `<label for="${id}">${field.label}</label>`;

          if (field.type === "textarea") {
            html += `<textarea id="${id}" rows="3"></textarea>`;
          } else if (field.type === "select") {
            const options = field.options.map((opt) => `<option value="${opt}">${opt}</option>`).join("");
            html += `<select id="${id}">${options}</select>`;
          } else {
            html += `<input type="${field.type}" id="${id}" />`;
          }
        });

        html += '<button type="submit">Submit</button></form>';
        this.container.innerHTML = html;

        // Attach the submit handler after the form exists in the DOM
        document.getElementById("builtForm").addEventListener("submit", (event) => {
          event.preventDefault();
          this.onSubmit(this.getFormData());
        });
      }

      // Returns all entered values as an object { label: value }
      getFormData() {
        const data = {};
        this.fields.forEach((field, index) => {
          const element = document.getElementById("field_" + index);
          data[field.label] = field.type === "checkbox" ? element.checked : element.value;
        });
        return data;
      }
    }

    const fields = [
      { type: "text", label: "Username" },
      { type: "email", label: "Email" },
      { type: "password", label: "Password" },
      { type: "number", label: "Age" },
      { type: "select", label: "Country", options: ["India", "USA", "UK"] },
      { type: "textarea", label: "About" },
      { type: "checkbox", label: "Subscribe" },
    ];

    new FormBuilder("formContainer", fields, (data) => {
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      console.log(data);
    });
  </script>
</body>
</html>
