<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    #errors { color: red; margin-top: 14px; }
    #success { color: green; font-weight: bold; margin-top: 14px; }
  </style>
</head>
<body>
  <h2>Login</h2>

  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" />

    <label for="password">Password</label>
    <input type="password" id="password" />

    <button type="submit">Login</button>
  </form>

  <ul id="errors"></ul>
  <div id="success"></div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errors = [];

      // Username: at least 5 characters
      if (!/^.{5,}$/.test(username)) {
        errors.push("Username must be at least 5 characters.");
      }

      // Password: separate RegExp for each rule, so we can show specific messages
      if (!/^.{8,}$/.test(password)) errors.push("Password must be at least 8 characters.");
      if (!/\d/.test(password)) errors.push("Password must include a number.");
      if (!/[A-Z]/.test(password)) errors.push("Password must include an uppercase letter.");
      if (!/[a-z]/.test(password)) errors.push("Password must include a lowercase letter.");
      if (!/[^A-Za-z0-9]/.test(password)) errors.push("Password must include a special character.");

      const errorList = document.getElementById("errors");
      const success = document.getElementById("success");
      errorList.innerHTML = "";
      success.textContent = "";

      if (errors.length === 0) {
        success.textContent = "Login successful!";
      } else {
        errors.forEach((message) => {
          const li = document.createElement("li");
          li.textContent = message;
          errorList.appendChild(li);
        });
      }
    });
  </script>
</body>
</html>
