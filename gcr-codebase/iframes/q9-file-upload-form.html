<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form</title>
</head>
<body>
    <h1>File Upload Form</h1>

    <form method="post" action="#">
        <label for="fileUpload">Upload your file:</label><br>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg,.png"><br><br>

        <p>Note: Only .jpg and .png image files are allowed to be uploaded.</p>

        <button type="submit">Upload</button>
    </form>
</body>
</html>
