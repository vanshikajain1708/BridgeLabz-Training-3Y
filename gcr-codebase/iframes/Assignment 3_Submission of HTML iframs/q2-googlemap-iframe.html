<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map Embed</title>
</head>
<body>
    <h1>Google Map using iframe</h1>

    <!-- 
        The loading="lazy" attribute tells the browser to delay loading the iframe 
        content until it is about to enter the viewport (visible area of the screen).
        This improves page load speed and saves bandwidth, since the map 
        doesn't load immediately if the user hasn't scrolled to it yet.
    -->
    <iframe 
        title="Map of Mathura, Uttar Pradesh"
        width="600" 
        height="450" 
        style="border:0" 
        loading="lazy"
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh&output=embed">
    </iframe>
</body>
</html>
