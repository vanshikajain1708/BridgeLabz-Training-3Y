<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login Form</h1>

    <form method="post" action="#">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- 
            A CSRF (Cross-Site Request Forgery) token is a hidden, unique value 
            generated by the server for each session/form. It helps verify that 
            the form submission actually came from the legitimate website and not 
            from a malicious site tricking the user into submitting unwanted requests.
        -->
        <input type="hidden" name="csrf_token" value="dummyCSRFTokenValue12345">

        <button type="submit">Login</button>
    </form>
</body>
</html>
