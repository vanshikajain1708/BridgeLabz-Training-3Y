<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6-transformations.css">
</head>
<body>
    <h1>CSS Transformations Showcase</h1>

    <div class="box-container">
        <div class="box-wrapper">
            <div class="box rotate-box">Rotate</div>
            <p class="label">rotate(45deg) on hover</p>
        </div>

        <div class="box-wrapper">
            <div class="box scale-box">Scale</div>
            <p class="label">scale(1.3) on hover</p>
        </div>

        <div class="box-wrapper">
            <div class="box translate-box">Translate</div>
            <p class="label">translate(20px, -20px) on hover</p>
        </div>

        <div class="box-wrapper">
            <div class="box skew-box">Skew</div>
            <p class="label">skew(15deg, 10deg) on hover</p>
        </div>
    </div>
</body>
</html>
