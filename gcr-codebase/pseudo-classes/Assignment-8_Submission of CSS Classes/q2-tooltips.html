<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2-tooltips.css">
</head>
<body>
    <h1>Tooltip Demonstration Page</h1>

    <div class="tooltip-container">
        <div class="tooltip-item">
            Hover Me
            <span class="tooltip-text">This is a simple tooltip!</span>
        </div>

        <div class="tooltip-item">
            Info Icon ℹ️
            <span class="tooltip-text">Additional information here.</span>
        </div>

        <div class="tooltip-item">
            Settings ⚙️
            <span class="tooltip-text">Click to open settings.</span>
        </div>
    </div>
</body>
</html>
