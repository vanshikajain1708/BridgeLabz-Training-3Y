<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes Demo</title>
    <link rel="stylesheet" href="q1-pseudo-classes.css">
</head>
<body>
    <h1>Pseudo-Classes Demonstration</h1>

    <div class="demo-row">
        <div class="demo-item">
            <a href="#" class="hover-link">Hover Link</a>
            <p>:hover changes color on mouse over</p>
        </div>

        <div class="demo-item">
            <input type="text" class="focus-input" placeholder="Click me">
            <p>:focus changes border on click</p>
        </div>

        <div class="demo-item">
            <button class="active-btn">Active Button</button>
            <p>:active changes color while clicking</p>
        </div>

        <div class="demo-item">
            <ul class="nth-list">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
            </ul>
            <p>:nth-child(2n) highlights even items</p>
        </div>
    </div>
</body>
</html>
