<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3-image-showcase.css">
</head>
<body>
    <h1>Image Showcase Layout</h1>

    <div class="showcase-grid">
        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/101/400/300" alt="Nature 1">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Trail</figcaption>
        </figure>

        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/102/400/300" alt="Nature 2">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest Path</figcaption>
        </figure>

        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/103/400/300" alt="Nature 3">
                <div class="overlay"></div>
            </div>
            <figcaption>Calm River</figcaption>
        </figure>

        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/104/400/300" alt="Nature 4">
                <div class="overlay"></div>
            </div>
            <figcaption>Golden Sunset</figcaption>
        </figure>

        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/106/400/300" alt="Nature 5">
                <div class="overlay"></div>
            </div>
            <figcaption>City Skyline</figcaption>
        </figure>

        <figure class="showcase-item">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/110/400/300" alt="Nature 6">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>
    </div>
</body>
</html>
