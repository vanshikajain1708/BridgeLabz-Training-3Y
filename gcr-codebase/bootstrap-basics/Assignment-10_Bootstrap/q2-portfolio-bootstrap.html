<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio - Bootstrap</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2-portfolio-bootstrap.css">
</head>
<body class="bg-light text-dark">
    <header class="text-center py-4">
        <!-- fw-bold: bold text utility -->
        <h1 class="fw-bold">Vanshika Jain</h1>
        <p class="text-muted">B.Tech CSE Student | Web Developer</p>
    </header>

    <main class="container text-center pb-5">
        <!-- img-fluid: responsive image, rounded-circle: circular shape -->
        <img src="https://via.placeholder.com/150" alt="Profile Picture" class="img-fluid rounded-circle mb-4">

        <div class="mb-5">
            <button class="btn btn-primary mx-2">Hire Me</button>
            <button class="btn btn-outline-secondary mx-2">Download CV</button>
        </div>

        <section class="row justify-content-center">
            <div class="col-md-6">
                <h4 class="mb-3">Contact Me</h4>
                <!-- form-control: Bootstrap styled input fields -->
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Your Name">
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Your Email">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary p-2">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Vanshika Jain. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
