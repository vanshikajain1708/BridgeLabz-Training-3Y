<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - CSS Grid</title>
    <link rel="stylesheet" href="q2-product-grid.css">
</head>
<body>
    <h1>Product Gallery</h1>

    <div class="grid-container">
        <div class="card">
            <h3>Wireless Headphones</h3>

        </div>
        <div class="card">
            <h3>Smart Watch</h3>
            <p class="price">$89.99</p>
        </div>
        <div class="card">
            <h3>Bluetooth Speaker</h3>
            <p class="price">$34.99</p>
        </div>
        <div class="card">
            <h3>Laptop Stand</h3>
            <p class="price">$24.99</p>
        </div>
        <div class="card">
            <h3>Mechanical Keyboard</h3>
            <p class="price">$59.99</p>
        </div>
        <div class="card">
            <h3>Gaming Mouse</h3>
            <p class="price">$29.99</p>
        </div>
        <div class="card">
            <h3>USB-C Hub</h3>
            <p class="price">$19.99</p>
        </div>
        <div class="card">
            <h3>Webcam HD</h3>
            <p class="price">$39.99</p>
        </div>

</body>
</html>
