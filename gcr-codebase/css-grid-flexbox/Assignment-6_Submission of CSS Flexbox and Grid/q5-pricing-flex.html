<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section - Flexbox</title>
    <link rel="stylesheet" href="q5-pricing-flex.css">
</head>
<body>
    <h1>Our Pricing Plans</h1>

    <div class="pricing-container">
        <div class="card">
            <h2>Basic</h2>
            <p class="price">$9/mo</p>
            <p>Great for individuals starting out.</p>
        </div>

        <div class="card featured">
            <h2>Standard</h2>
            <p class="price">$29/mo</p>
            <p>Perfect for growing teams and businesses.</p>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <p class="price">$59/mo</p>
            <p>Best for large organizations with advanced needs.</p>
        </div>
    </div>
</body>
</html>
