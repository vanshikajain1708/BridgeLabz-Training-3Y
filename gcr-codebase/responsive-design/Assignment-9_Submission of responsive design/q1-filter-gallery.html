<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1-filter-gallery.css">
</head>
<body>
    <h1>Responsive Image Filter Gallery</h1>

    <div class="gallery">
        <figure class="gallery-item">
            <img src="https://picsum.photos/id/201/400/300" alt="Blur" class="filter-blur">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/id/202/400/300" alt="Grayscale" class="filter-grayscale">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/id/203/400/300" alt="Sepia" class="filter-sepia">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/id/204/400/300" alt="Brightness" class="filter-brightness">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/id/205/400/300" alt="Contrast" class="filter-contrast">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://picsum.photos/id/206/400/300" alt="Hue Rotate" class="filter-hue">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </div>
</body>
</html>
