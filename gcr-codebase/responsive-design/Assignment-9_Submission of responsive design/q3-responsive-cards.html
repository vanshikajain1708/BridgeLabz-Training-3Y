<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards with Media Queries</title>
    <link rel="stylesheet" href="q3-responsive-cards.css">
</head>
<body>
    <h1>Responsive Cards</h1>

    <div class="card-container">
        <div class="card">
            <h2>Card One</h2>
            <p>Responsive layout using media queries.</p>
        </div>
        <div class="card">
            <h2>Card Two</h2>

        </div>
        <div class="card">
            <h2>Card Three</h2>
            <p>Changes background color on hover.</p>
        </div>
        <div class="card">
            <h2>Card Four</h2>
            <p>Equal spacing and padding maintained.</p>
        </div>
    </div>
</body>
