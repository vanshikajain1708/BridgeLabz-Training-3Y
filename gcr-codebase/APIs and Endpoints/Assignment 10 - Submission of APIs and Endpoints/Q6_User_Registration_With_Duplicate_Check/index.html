<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q6 - User Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 450px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; width: 100%; }
    #message { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>User Registration</h2>
  <form id="registerForm">
    <label>Full Name:</label>
    <input type="text" id="name" required placeholder="Enter your name">

    <label>Email:</label>
    <input type="email" id="email" required placeholder="abc@gmail.com">

    <button type="submit">Register</button>
  </form>
  <div id="message"></div>

  <script>
    const API_URL = "http://localhost:3006/users";

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const msgDiv = document.getElementById("message");

      try {
        // Step 1: Check if email already exists
        const checkRes = await axios.get(`${API_URL}?email=${encodeURIComponent(email)}`);

        if (checkRes.data.length > 0) {
          msgDiv.style.color = "red";
          msgDiv.textContent = "Email already registered.";
          return;
        }

        // Step 2: Register new user via POST
        await axios.post(API_URL, { name, email });
        msgDiv.style.color = "green";
        msgDiv.textContent = "Registration successful!";
        document.getElementById("registerForm").reset();
      } catch (error) {
        msgDiv.style.color = "red";
        msgDiv.textContent = "Something went wrong while registering.";
      }
    });
  </script>
</body>
</html>
