<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 - Multi-API Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    .grid { display: flex; gap: 20px; margin-top: 20px; }
    .card { flex: 1; padding: 20px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
    .skeleton { height: 32px; background: #e0e0e0; border-radius: 4px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    #warning { color: #b71c1c; background: #ffebee; padding: 10px; border-radius: 5px; display: none; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Admin Dashboard</h2>
  <div id="warning">Some data could not be loaded.</div>

  <div class="grid">
    <div class="card">
      <h3>Total Users</h3>
      <div id="usersCount"><div class="skeleton"></div></div>
    </div>
    <div class="card">
      <h3>Total Orders</h3>
      <div id="ordersCount"><div class="skeleton"></div></div>
    </div>
    <div class="card">
      <h3>Total Products</h3>
      <div id="productsCount"><div class="skeleton"></div></div>
    </div>
  </div>

  <script>
    const BASE_URL = "http://localhost:3004";

    async function fetchEndpoint(endpoint) {
      try {
        const res = await fetch(`${BASE_URL}${endpoint}`);
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        return { ok: true, count: data.length };
      } catch (err) {
        return { ok: false, count: "N/A" };
      }
    }

    async function loadDashboard() {
      const [users, orders, products] = await Promise.all([
        fetchEndpoint("/users"),
        fetchEndpoint("/orders"),
        fetchEndpoint("/products")
      ]);

      document.getElementById("usersCount").innerHTML = `<h2>${users.count}</h2>`;
      document.getElementById("ordersCount").innerHTML = `<h2>${orders.count}</h2>`;
      document.getElementById("productsCount").innerHTML = `<h2>${products.count}</h2>`;

      if (!users.ok || !orders.ok || !products.ok) {
        document.getElementById("warning").style.display = "block";
      }
    }

    loadDashboard();
  </script>
</body>
</html>
